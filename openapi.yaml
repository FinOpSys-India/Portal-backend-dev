openapi: 3.1.0

info:
  title: FinOpSys Portal API
  version: "1.0.0"
  description: |
    Complete request/response contract for the FinOpSys Portal backend.

    ## Casing
    Requests accept **snake_case AND camelCase** — `company_id` and `companyId`
    both work. Responses are **always camelCase**. Sending both spellings of one
    field is a 400: one would have been silently discarded and the caller could
    not learn which.

    ## Envelopes
    Success: `{ success: true, message: string, data: object }` on every endpoint
    except `POST /billing/webhook`.
    Error: `{ success: false, error: { code, message, requestId, fields?, details? } }`.
    There is no `errors` array — read `error.fields` (per-field map) and
    `error.details` (structured extras).

    ## Money
    Every monetary value is an **integer in minor units** (cents) in a field
    ending `AmountMinor`, beside a `currency`. `unitAmountMinor: 24900` +
    `currency: "USD"` is $249.00. The one exception is `lastYearRevenue`, a
    decimal string in major units, because it is a business figure not a charge.

    ## Auth
    `Authorization: Bearer <accessToken>`, 15-minute lifetime. Renew with
    `POST /auth/refresh`, which ROTATES the refresh token — each is single-use,
    and replaying a rotated one revokes every session for that user.
  contact:
    name: Backend team

servers:
  - url: http://localhost:3000/api
    description: Local development
  - url: https://{host}/api
    description: Deployed
    variables:
      host:
        default: api.example.com

tags:
  - name: Auth
    description: Sign-up, login, session lifecycle, password reset
  - name: Onboarding
    description: Provisioning the customer account and onboarding companies
  - name: Companies
    description: Company records and team management
  - name: Users
    description: The directory behind assignment pickers
  - name: Invitations
    description: Inviting people into the portal
  - name: Billing
    description: Plans, checkout, subscriptions, payments
  - name: System
    description: Health and Stripe callbacks

security:
  - bearerAuth: []

paths:
  # ==========================================================================
  # AUTH
  # ==========================================================================
  /auth/signup:
    post:
      tags: [Auth]
      summary: Complete an invitation and create the account
      description: |
        Signs the user straight in — there is no OTP step, because the
        invitation token already proves control of the mailbox.
        Sets an HttpOnly `refreshToken` cookie and a readable `csrfToken` cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitationToken, email, firstName, lastName, password]
              additionalProperties: false
              properties:
                invitationToken:
                  type: string
                  pattern: '^[0-9a-f]{64}$'
                  description: From the `?token=` parameter of the invitation link.
                email:
                  type: string
                  maxLength: 254
                  description: Must match the invitation's address.
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                password: { $ref: '#/components/schemas/Password' }
            example:
              invitationToken: "9f3c2a04b1e8d7c6a5b4938271605f4e3d2c1b0a9f8e7d6c5b4a39281706f5e4d"
              email: ada@example.com
              firstName: Ada
              lastName: Lovelace
              password: StrongPass1
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          user: { $ref: '#/components/schemas/User' }
                          tokens: { $ref: '#/components/schemas/Tokens' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: Invitation already used, or the email already has an account
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: Invitation expired or revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Step 1 of login — verify password, send an OTP
      description: |
        Returns **202**, not 200: the request succeeded but authentication is not
        complete. No token is issued here.

        Every credential failure — unknown email, wrong password, locked account,
        inactive account — returns the identical `401 INVALID_CREDENTIALS`. Do not
        try to distinguish them in the UI.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 1024 }
            example: { email: ada@example.com, password: StrongPass1 }
      responses:
        '202':
          description: Password accepted, OTP emailed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: INVALID_CREDENTIALS
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: OTP_DELIVERY_UNAVAILABLE — password was correct but the email failed
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/otp:
    post:
      tags: [Auth]
      summary: Step 2 of login — verify or resend the OTP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: verify
                  type: object
                  required: [action, challengeId, otp]
                  additionalProperties: false
                  properties:
                    action: { type: string, enum: [verify] }
                    challengeId: { type: string, format: uuid }
                    otp:
                      type: string
                      pattern: '^[0-9]{6}$'
                      description: Must be a STRING — a leading zero is significant.
                - title: resend
                  type: object
                  required: [action, challengeId]
                  additionalProperties: false
                  properties:
                    action: { type: string, enum: [resend] }
                    challengeId: { type: string, format: uuid }
            examples:
              verify:
                value: { action: verify, challengeId: 0f0f7f8b-1f2a-4c33-9a0e-3b2d5e6f7a81, otp: "012345" }
              resend:
                value: { action: resend, challengeId: 0f0f7f8b-1f2a-4c33-9a0e-3b2d5e6f7a81 }
      responses:
        '200':
          description: Signed in (verify) or a new code sent (resend)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/AuthenticatedSession'
                          - $ref: '#/components/schemas/OtpResent'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: INVALID_OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: ACCOUNT_INACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: CHALLENGE_NOT_ACTIVE — unknown, used, or invalidated challenge
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: OTP_EXPIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429':
          description: OTP_ATTEMPT_LIMIT_EXCEEDED, OTP_RESEND_COOLDOWN, OTP_RESEND_LIMIT, RATE_LIMITED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the refresh token and get a new access token
      description: |
        **Single-use.** Discard the old refresh token immediately.
        **Never replay one** — a replayed token is treated as theft and revokes
        every session for that user.

        Requires the CSRF header when the token comes from the cookie. Clients
        sending it in the body (mobile, server-to-server) are exempt.

        Serialise concurrent refreshes on the client: share one in-flight promise,
        or two tabs will replay a rotated token and log the user out everywhere.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: Only for clients with no cookie jar.
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          accessToken: { type: string }
                          expiresInSeconds: { type: integer, example: 900 }
                          refreshToken: { type: string }
                          refreshTokenExpiresAt: { type: string, format: date-time }
                          user: { $ref: '#/components/schemas/User' }
                          csrfToken: { type: string }
        '401':
          description: |
            REFRESH_TOKEN_INVALID — unknown, expired, revoked, or replayed. All four
            answer identically. Send the user to /login; never retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: CSRF_TOKEN_INVALID or ACCOUNT_INACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: End this session
      description: Always 200, even with no or an expired token. Clears both cookies.
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Signed out
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          sessionsRevoked: { type: integer, example: 1 }
        '403':
          description: CSRF_TOKEN_INVALID
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: End every session for this user
      description: |
        Identity comes from the access token, not the cookie — so this works even
        when the cookie for this device is gone, which is usually the situation
        someone reaching for "sign out everywhere" is in.
      responses:
        '200':
          description: Signed out everywhere
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          sessionsRevoked: { type: integer, example: 4 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/password-reset:
    post:
      tags: [Auth]
      summary: Step 1 of password reset — request a code
      description: |
        **Always 202 with the same body**, whether or not the address is
        registered. Never tell the user "no such account" — the response is
        deliberately identical, and for an unknown address the `challengeId` is a
        throwaway that verifies against nothing.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
            example: { email: ada@example.com }
      responses:
        '202':
          description: Accepted (identical for known and unknown addresses)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/otp:
    post:
      tags: [Auth]
      summary: Step 2 of password reset — verify or resend
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, challengeId]
              additionalProperties: false
              properties:
                action: { type: string, enum: [verify, resend] }
                challengeId: { type: string, format: uuid }
                otp: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: Ticket issued (verify) or a new code sent (resend)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        oneOf:
                          - type: object
                            properties:
                              otpVerified: { type: boolean, const: true }
                              resetToken:
                                type: string
                                pattern: '^[0-9a-f]{96}$'
                                description: Single-use, ~10 minutes. Keep in memory only.
                              expiresInSeconds: { type: integer, example: 600 }
                              maskedEmail: { type: string }
                          - $ref: '#/components/schemas/OtpResent'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: INVALID_OTP
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: CHALLENGE_NOT_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: OTP_EXPIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/password-reset/confirm:
    post:
      tags: [Auth]
      summary: Step 3 of password reset — set the new password
      description: |
        Issues **no session**. Clear local auth state and route to /login.
        Every existing session for the user is revoked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, password]
              additionalProperties: false
              properties:
                resetToken: { type: string, pattern: '^[0-9a-f]{96}$' }
                password: { $ref: '#/components/schemas/Password' }
                confirmPassword: { type: string }
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          passwordUpdated: { type: boolean, const: true }
                          sessionsRevoked: { type: integer, example: 3 }
        '400':
          description: VALIDATION_ERROR or PASSWORD_UNCHANGED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '403':
          description: ACCOUNT_INACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: RESET_TOKEN_NOT_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '410':
          description: RESET_TOKEN_EXPIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # ONBOARDING
  # ==========================================================================
  /onboarding:
    get:
      tags: [Onboarding]
      summary: Current onboarding status
      description: |
        Describes the CUSTOMER account, not any company. Contains no company id —
        use `GET /companies` for those.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OnboardingStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Onboarding]
      summary: Provision the caller as OWNER of a new customer account
      description: |
        Idempotent — 201 the first time, 200 afterwards.

        **May return `data.tokens.accessToken`.** It appears when this call changed
        your role (it promotes you to CUSTOMER/OWNER). Swap your stored token for
        it, or the next step will rely on a stale claim.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                companyName:
                  type: string
                  maxLength: 255
                  description: Display name for the CUSTOMER account (not a Company row).
      responses:
        '201':
          description: Provisioned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/OnboardingStatus'
                          - type: object
                            properties:
                              tokens:
                                type: object
                                properties:
                                  accessToken: { type: string }
                                  expiresInSeconds: { type: integer }
        '200':
          description: Already provisioned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OnboardingStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onboarding/profile:
    put:
      tags: [Onboarding]
      summary: Submit the onboarding profile form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName, phone, jobTitle]
              additionalProperties: false
              properties:
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                phone:
                  type: string
                  maxLength: 30
                  description: 7–15 digits after stripping separators. Stored verbatim.
                jobTitle: { type: string, maxLength: 150 }
            example: { firstName: Ada, lastName: Lovelace, phone: "+1 415 555 0123", jobTitle: Founder }
      responses:
        '200':
          description: Saved — returns the whole status object
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/OnboardingStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onboarding/company:
    post:
      tags: [Onboarding]
      summary: Onboard a new company
      description: |
        Requires the OWNER role.

        **Send an `Idempotency-Key`.** Unlike checkout, this endpoint derives no
        fallback key, so a double-click creates two companies.

        **Persist `data.company.id`** — it is the `companyId` every company and
        billing endpoint needs.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompanyInput' }
      responses:
        '201':
          description: Company created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          company: { $ref: '#/components/schemas/Company' }
                          primaryAddress: { $ref: '#/components/schemas/Address' }
          headers:
            Idempotent-Replay:
              schema: { type: string, enum: ["true"] }
              description: Present when the stored response was replayed.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN or OWNER_ROLE_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: COMPANY_EMAIL_IN_USE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: IDEMPOTENCY_KEY_REUSED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # COMPANIES
  # ==========================================================================
  /companies:
    get:
      tags: [Companies]
      summary: List every company the caller can reach
      description: |
        Owned, managed as accounting manager, or served as an active specialist.
        **This is how you rediscover a companyId after a page refresh** — nothing
        else returns one except the call that created it.
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, companyName, status, updatedAt], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: status, in: query, schema: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, ARCHIVED] } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
      responses:
        '200':
          description: A page of companies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          companies:
                            type: array
                            items: { $ref: '#/components/schemas/CompanyDetail' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /companies/{companyId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: One company with its primary address
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          company: { $ref: '#/components/schemas/CompanyDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      summary: Correct company details
      description: |
        Every field optional, at least one required. Supplying `address` REPLACES
        it wholesale — a partial address update is how you get a new street on an
        old postcode, and this address reaches Stripe invoices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CompanyInput'
                - { required: [] }
            example: { companyName: "Acme Analytics Inc", employeeCount: 30 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          company: { $ref: '#/components/schemas/CompanyDetail' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: COMPANY_EMAIL_IN_USE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    delete:
      tags: [Companies]
      summary: Archive a company (soft delete)
      description: Refused while a subscription is still billing — cancel it first.
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          company: { $ref: '#/components/schemas/Company' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SUBSCRIPTION_STILL_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /companies/{companyId}/accounting-manager:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    put:
      tags: [Companies]
      summary: Assign or replace the accounting manager (ADMIN only)
      description: |
        **ADMIN only** — deliberately narrower than every other company write. An
        accounting manager is internal staff, and who serves which account is a
        staffing decision, not something a customer makes about their own company.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accountingManagerUserId]
              additionalProperties: false
              properties:
                accountingManagerUserId:
                  type: integer
                  description: Must hold the ACCOUNTING_MANAGER role. Find one via GET /users.
            example: { accountingManagerUserId: 19 }
      responses:
        '200':
          description: Assigned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          company: { $ref: '#/components/schemas/Company' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN or ADMIN_ROLE_REQUIRED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: COMPANY_NOT_FOUND or USER_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: INVALID_ACCOUNTING_MANAGER_ROLE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /companies/{companyId}/specialists:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: List specialist assignments
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [assignedAt, specialistUserId], default: assignedAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: includeInactive, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          companyId: { type: integer }
                          specialists:
                            type: array
                            items: { $ref: '#/components/schemas/Assignment' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Companies]
      summary: Assign a specialist to one or more specializations
      description: |
        **201** when at least one assignment was created, **200** when all were
        skipped as already active. Duplicates are not an error — read `skipped`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialistUserId, specializationCodes]
              additionalProperties: false
              properties:
                specialistUserId:
                  type: integer
                  description: Must hold the SPECIALIST role.
                specializationCodes:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [BOOKKEEPING, PAYROLL, TAX, FA_Q] }
            example: { specialistUserId: 22, specializationCodes: [TAX, PAYROLL] }
      responses:
        '201':
          description: At least one assignment created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          assignments:
                            type: array
                            items: { $ref: '#/components/schemas/Assignment' }
                          skipped:
                            type: array
                            items: { type: string }
                            description: Codes already active for this specialist.
        '200':
          description: All requested assignments already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '400':
          description: VALIDATION_ERROR or INVALID_SPECIALIZATION
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: INVALID_SPECIALIST_ROLE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /companies/{companyId}/specialists/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
      - { name: assignmentId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Companies]
      summary: Remove a specialist assignment
      description: Soft removal (status INACTIVE). Idempotent.
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          assignment: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: COMPANY_NOT_FOUND or ASSIGNMENT_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /companies/{companyId}/team:
    parameters:
      - $ref: '#/components/parameters/CompanyId'
    get:
      tags: [Companies]
      summary: Owner, accounting manager, and specialists
      description: |
        Each specialization carries its own `assignmentId`, so a remove button can
        be rendered straight from this payload.
      responses:
        '200':
          description: The team
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Team' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==========================================================================
  # USERS
  # ==========================================================================
  /users:
    get:
      tags: [Users]
      summary: User directory for assignment pickers
      description: |
        ADMIN or a company OWNER only. ACTIVE users only. Never returns a password
        hash or any login-security column.
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [ADMIN, ACCOUNTING_MANAGER, SPECIALIST, CUSTOMER] } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [firstName, lastName, email, createdAt], default: firstName } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: A page of users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          users:
                            type: array
                            items: { $ref: '#/components/schemas/DirectoryUser' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ==========================================================================
  # INVITATIONS
  # ==========================================================================
  /invitations:
    post:
      tags: [Invitations]
      summary: Create and email an invitation (ADMIN only)
      description: |
        The inviter is the authenticated caller. **`invitedBy` is rejected** —
        it used to be a body field on an unauthenticated endpoint.

        **Read `data.emailSent`.** A 201 does not mean the invitee heard anything;
        when it is false the row stays PENDING and you should offer *resend*.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, firstName, lastName, roleId]
              additionalProperties: false
              properties:
                email: { type: string, maxLength: 254 }
                firstName: { type: string, maxLength: 100 }
                lastName: { type: string, maxLength: 100 }
                roleId:
                  type: integer
                  description: 1 ADMIN, 2 ACCOUNTING_MANAGER, 3 SPECIALIST, 4 CUSTOMER
                specificRoleId:
                  type: [integer, "null"]
                  description: |
                    REQUIRED for roles with subdivisions (SPECIALIST, CUSTOMER),
                    FORBIDDEN for those without (ADMIN, ACCOUNTING_MANAGER).
            example: { email: ada@example.com, firstName: Ada, lastName: Lovelace, roleId: 4, specificRoleId: 1 }
      responses:
        '201':
          description: Created (check emailSent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: '#/components/schemas/Invitation' }
                          emailSent: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: FORBIDDEN or INVITER_NOT_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: USER_ALREADY_EXISTS or INVITATION_ALREADY_SENT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Invitations]
      summary: List invitations
      description: ADMIN sees all; anyone else sees only the ones they sent.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDING, SENT, ACCEPTED, EXPIRED, REVOKED] } }
        - { name: search, in: query, schema: { type: string, maxLength: 255 } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [createdAt, expiresAt, email, status], default: createdAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
      responses:
        '200':
          description: A page of invitations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          invitations:
                            type: array
                            items: { $ref: '#/components/schemas/Invitation' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invitations/{invitationId}:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: integer } }
    delete:
      tags: [Invitations]
      summary: Revoke an invitation
      description: |
        A state change to REVOKED, not a delete — the audit trail survives.
        Idempotent. Answers 404 (not 403) for another user's invitation, so the
        endpoint cannot be used to enumerate.
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: '#/components/schemas/Invitation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: INVITATION_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: INVITATION_ALREADY_ACCEPTED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  /invitations/{invitationId}/resend:
    parameters:
      - { name: invitationId, in: path, required: true, schema: { type: integer } }
    post:
      tags: [Invitations]
      summary: Re-send an invitation
      description: |
        **Mints a NEW token and invalidates the previous link.** Only a SHA-256
        digest of the token is stored, so the original cannot be reproduced — and
        superseding an old link on every resend is the safer behaviour anyway.
        Tell the invitee to use the most recent email.
      responses:
        '200':
          description: Re-sent (check emailSent)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          invitation: { $ref: '#/components/schemas/Invitation' }
                          emailSent: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: INVITATION_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: INVITATION_ALREADY_ACCEPTED or INVITATION_REVOKED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ==========================================================================
  # BILLING
  # ==========================================================================
  /billing/plans:
    get:
      tags: [Billing]
      summary: The sellable catalog
      description: |
        Send back only `optionId` / `planId`. Never a price id, never an amount.
        `stripe` appears only when BILLING_EXPOSE_STRIPE_IDS is on (off in
        production) — never depend on it.
      responses:
        '200':
          description: The catalog
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PlanCatalog' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /billing/checkout:
    post:
      tags: [Billing]
      summary: Create a Stripe Checkout Session
      description: |
        Redirect the browser to `checkoutUrl`. Nothing is active until Stripe's
        webhook confirms payment.

        Show `pricingSummary` rather than the figures from `/billing/plans` — these
        were re-verified against Stripe.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSelection' }
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          checkoutSessionId: { type: string, example: cs_test_a1B2c3 }
                          checkoutUrl: { type: string, format: uri }
                          companyId: { type: integer }
                          selectedServices:
                            type: array
                            items: { type: string, enum: [bookkeeping, payroll, taxes] }
                          pricingSummary: { $ref: '#/components/schemas/PricingSummary' }
        '400':
          description: VALIDATION_ERROR, NO_SERVICE_SELECTED, INVALID_*_OPTION, INVALID_*_COUNT
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SUBSCRIPTION_ALREADY_ACTIVE — use POST /billing/subscription/services instead
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: IDEMPOTENCY_KEY_REUSED, STRIPE_PRICE_*, INCOMPATIBLE_CHECKOUT_PRICES
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: CHECKOUT_SESSION_CREATION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/checkout-status:
    get:
      tags: [Billing]
      summary: Authoritative payment status
      description: |
        Poll after the Stripe redirect. **Landing on the success page is not proof
        of payment.** Keep polling while `status` is `pending` or `processing` —
        asynchronous methods sit in `processing` for days and can still fail.
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string, pattern: '^cs_[A-Za-z0-9_]{4,250}$' }
          description: Also accepted as `session_id`, which is what Stripe puts in the success URL.
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/CheckoutStatus' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: CHECKOUT_SESSION_ACCESS_DENIED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: CHECKOUT_SESSION_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/subscription:
    get:
      tags: [Billing]
      summary: The company's current subscription
      description: |
        **Always 200, never 404.** A company with nothing bought yet returns
        `hasSubscription: false, subscription: null` — that is a normal state, not
        an error.

        `lines[].unitAmountMinor` is the price captured AT PURCHASE, not today's
        list price.
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
      responses:
        '200':
          description: Subscription, or an explicit empty state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          companyId: { type: integer }
                          hasSubscription: { type: boolean }
                          subscription:
                            oneOf:
                              - $ref: '#/components/schemas/Subscription'
                              - type: "null"
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Billing]
      summary: Cancel the subscription
      description: |
        **Requires a JSON body** — many HTTP clients omit one on DELETE by default.

        `atPeriodEnd` defaults to true: the customer keeps what they paid for.
        Passing false forfeits the remainder, so warn before offering it.

        Read `data.subscription.cancelAtPeriodEnd` and `.status`, not the message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              additionalProperties: false
              properties:
                companyId: { type: integer }
                atPeriodEnd: { type: boolean, default: true }
            example: { companyId: 11, atPeriodEnd: true }
      responses:
        '200':
          description: Cancelled or scheduled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          subscription: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: COMPANY_NOT_FOUND or SUBSCRIPTION_NOT_FOUND
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: SUBSCRIPTION_NOT_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: SUBSCRIPTION_CANCEL_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/subscription/services:
    post:
      tags: [Billing]
      summary: Add a service to a LIVE subscription
      description: |
        Added to the existing Stripe subscription, so the customer keeps one
        renewal date and one invoice. Prorated.

        Use this instead of `/billing/checkout` when the company already has an
        active subscription.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceSelection' }
      responses:
        '200':
          description: Services added
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          added:
                            type: array
                            items:
                              type: object
                              properties:
                                service: { type: string }
                                component: { type: string }
                                optionId: { type: string }
                                quantity: { type: integer }
                          pricingSummary: { $ref: '#/components/schemas/PricingSummary' }
                          subscription: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SERVICE_ALREADY_SUBSCRIBED or SUBSCRIPTION_NOT_ACTIVE
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '422':
          description: STRIPE_PRICE_* or INCOMPATIBLE_CHECKOUT_PRICES
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: SUBSCRIPTION_UPDATE_FAILED — may be PARTIALLY applied, refetch
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/subscription/payroll:
    patch:
      tags: [Billing]
      summary: Change the billed payroll head counts
      description: |
        At least one count required. Payroll must already be on the subscription —
        otherwise 409 PAYROLL_NOT_SUBSCRIBED, and you add it via
        `/billing/subscription/services`.

        **On 502, refetch** — `details.applied` names the components that did go
        through, so the change may be partially applied.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              additionalProperties: false
              properties:
                companyId: { type: integer }
                employeeCount: { type: integer, minimum: 0, maximum: 5000 }
                contractorCount: { type: integer, minimum: 0, maximum: 5000 }
            example: { companyId: 11, employeeCount: 15 }
      responses:
        '200':
          description: Updated (or unchanged)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          changes:
                            type: array
                            items:
                              type: object
                              properties:
                                component: { type: string, enum: [employees, contractors] }
                                from: { type: integer }
                                to: { type: integer }
                          subscription: { $ref: '#/components/schemas/Subscription' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SUBSCRIPTION_NOT_ACTIVE, PAYROLL_NOT_SUBSCRIBED, SUBSCRIPTION_UPDATE_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: SUBSCRIPTION_UPDATE_FAILED — check details.applied
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/payments:
    get:
      tags: [Billing]
      summary: Payment history
      description: |
        Returns 200 with an empty array when there is no history.
        `REFUNDED` and `amountRefundedMinor` are real — a partial refund keeps
        status `PAID` with a non-zero refund; a full refund becomes `REFUNDED`.
      parameters:
        - $ref: '#/components/parameters/CompanyIdQuery'
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: sort, in: query, schema: { type: string, enum: [paidAt, createdAt, amountPaid, status], default: paidAt } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: status, in: query, schema: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED] } }
      responses:
        '200':
          description: A page of payments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          companyId: { type: integer }
                          payments:
                            type: array
                            items: { $ref: '#/components/schemas/Payment' }
                          pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /billing/portal:
    post:
      tags: [Billing]
      summary: A one-time link into Stripe's hosted billing portal
      description: Short-lived and single-customer. Mint one per click; never cache.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              additionalProperties: false
              properties:
                companyId: { type: integer }
      responses:
        '201':
          description: Portal session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          portalUrl: { type: string, format: uri }
                          companyId: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SUBSCRIPTION_NOT_FOUND — the company has never checked out
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: PORTAL_SESSION_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  /billing/webhook:
    post:
      tags: [System]
      summary: Stripe callback — DO NOT CALL FROM THE FRONTEND
      description: |
        Authenticated by the `Stripe-Signature` header against the raw body, not by
        a token. The ONLY endpoint that does not use the standard envelope.
        This is the only place a service is ever activated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: A Stripe Event object. }
      responses:
        '200':
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean, const: true }
                  duplicate: { type: boolean }
        '400':
          description: WEBHOOK_SIGNATURE_INVALID
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '500':
          description: WEBHOOK_PROCESSING_FAILED
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '503': { $ref: '#/components/responses/StripeUnavailable' }

  # ==========================================================================
  # SYSTEM
  # ==========================================================================
  /health:
    get:
      tags: [System]
      summary: Readiness check
      description: Round-trips a real database query, unlike `GET /`.
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ok }
                          database: { type: string, const: up }
                          latencyMs: { type: integer }
        '503':
          description: Database unreachable
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <accessToken>. 15-minute lifetime.'
    cookieAuth:
      type: apiKey
      in: cookie
      name: refreshToken
      description: HttpOnly refresh cookie. Only /auth/refresh and /auth/logout read it.

  parameters:
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    CompanyIdQuery:
      name: companyId
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
      description: Also accepted as `company_id`.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
      description: Retrying with the same key replays the stored response.
    CsrfHeader:
      name: x-csrf-token
      in: header
      required: false
      schema: { type: string }
      description: Required when authenticating by cookie. Echo the csrfToken cookie value.

  responses:
    ValidationError:
      description: VALIDATION_ERROR — see error.fields and error.details
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: AUTH_REQUIRED, INVALID_TOKEN, TOKEN_EXPIRED, or USER_NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: FORBIDDEN or COMPANY_ACCESS_DENIED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: COMPANY_NOT_FOUND or NOT_FOUND
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: RATE_LIMITED — back off by details.retryAfterSeconds
      headers:
        Retry-After: { schema: { type: integer } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    StripeUnavailable:
      description: STRIPE_NOT_CONFIGURED
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  schemas:
    Envelope:
      type: object
      required: [success, message, data]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
        data: { type: object }

    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              description: Stable machine code. Branch on this AND the status.
              example: VALIDATION_ERROR
            message: { type: string }
            requestId:
              type: string
              description: Quote this in bug reports — it keys the backend logs.
            fields:
              type: object
              additionalProperties: { type: string }
              description: |
                Per-field messages for form highlighting. Keys are camelCase
                regardless of how you sent them. The key `_` is a form-level
                message belonging to no single field.
            details:
              type: object
              description: Structured extras — allowed, unknown, missing, retryAfterSeconds, conflictingFields.
            stack:
              type: string
              description: Only when DEBUG_ERRORS=true.
      example:
        success: false
        error:
          code: VALIDATION_ERROR
          message: The submitted information is invalid.
          requestId: req_9f2c1a4b7e0d5836
          fields: { companyEmail: Enter a valid email address. }

    Password:
      type: string
      minLength: 8
      description: |
        At least 8 characters and at most 72 BYTES, with at least one lowercase,
        one uppercase, and one digit. No special character required.
        Never trimmed — leading/trailing spaces are significant.

    Pagination:
      type: object
      properties:
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: [string, "null"]
          enum: [ADMIN, ACCOUNTING_MANAGER, SPECIALIST, CUSTOMER, null]
        specificRole:
          type: [string, "null"]
          description: Gate "owner" features on this being OWNER, NOT on role.
        status: { type: string, enum: [INVITED, ACTIVE, HIBERNATED] }

    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
        csrfToken: { type: string }

    OtpChallenge:
      type: object
      properties:
        otpRequired: { type: boolean, const: true }
        challengeId: { type: string, format: uuid }
        maskedEmail: { type: string, example: "a**a@example.com" }
        expiresInSeconds: { type: integer, example: 300, description: OTP lifetime. }
        resendAvailableInSeconds: { type: integer, example: 60 }

    OtpResent:
      type: object
      properties:
        otpResent: { type: boolean, const: true }
        expiresInSeconds: { type: integer, example: 300 }
        resendAvailableInSeconds: { type: integer, example: 60 }

    AuthenticatedSession:
      type: object
      properties:
        authenticated: { type: boolean, const: true }
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        expiresInSeconds: { type: integer, example: 900, description: ACCESS TOKEN lifetime here. }
        refreshTokenExpiresAt: { type: string, format: date-time }
        csrfToken: { type: string }

    OnboardingStatus:
      type: object
      properties:
        user:
          allOf:
            - $ref: '#/components/schemas/User'
            - type: object
              properties:
                phone: { type: [string, "null"] }
                jobTitle: { type: [string, "null"] }
        customer:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
            - type: "null"
        onboarding:
          type: object
          properties:
            accountProvisioned: { type: boolean }
            profileComplete: { type: boolean }
            complete: { type: boolean }

    Address:
      type: object
      properties:
        id: { type: integer }
        addressLine1: { type: string }
        addressLine2: { type: [string, "null"] }
        city: { type: string }
        state: { type: [string, "null"] }
        postalCode: { type: [string, "null"] }
        country: { type: string }
        countryCode: { type: [string, "null"] }

    AddressInput:
      type: object
      required: [addressLine1, city, state, postalCode, country, countryCode]
      additionalProperties: false
      properties:
        addressLine1: { type: string, maxLength: 255 }
        addressLine2: { type: string, maxLength: 255 }
        city: { type: string, maxLength: 120 }
        state:
          type: string
          maxLength: 120
          description: 'US accepts "TX" or "Texas" and stores "TX". Required unless the country has no subdivisions.'
        postalCode:
          type: string
          maxLength: 20
          description: Format-checked for ~20 countries.
        country: { type: string, maxLength: 100 }
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          description: Real ISO 3166-1 alpha-2 only — 'XX' is rejected.

    CompanyInput:
      type: object
      required: [companyName, companyType, companyEmail, companyPhone, employeeCount, lastYearRevenue, revenueCurrency, address]
      additionalProperties: false
      properties:
        companyName: { type: string, maxLength: 255 }
        companyType:
          type: string
          enum: [SOLE_PROPRIETORSHIP, PARTNERSHIP, LIMITED_LIABILITY_COMPANY, C_CORPORATION, S_CORPORATION, NON_PROFIT, OTHER]
        companyEmail:
          type: string
          maxLength: 254
          description: Unique across live companies AND user login addresses.
        companyPhone: { type: string, maxLength: 30 }
        employeeCount: { type: integer, minimum: 0, maximum: 1000000 }
        lastYearRevenue:
          type: [string, number]
          description: Up to 16 integer digits and 2 decimals. ALWAYS returned as a string.
        revenueCurrency: { type: string, minLength: 3, maxLength: 3 }
        address: { $ref: '#/components/schemas/AddressInput' }
      example:
        companyName: Acme Analytics LLC
        companyType: LIMITED_LIABILITY_COMPANY
        companyEmail: billing@acme.example
        companyPhone: "+1 415 555 0199"
        employeeCount: 24
        lastYearRevenue: "1850000.00"
        revenueCurrency: USD
        address:
          addressLine1: 500 Market St
          addressLine2: Suite 12
          city: San Francisco
          state: CA
          postalCode: "94105"
          country: United States
          countryCode: US

    Company:
      type: object
      properties:
        id: { type: integer }
        companyName: { type: string }
        companyType: { type: string }
        companyEmail: { type: string }
        companyPhone: { type: string }
        employeeCount: { type: integer }
        lastYearRevenue:
          type: [string, "null"]
          example: "1850000.00"
          description: Decimal STRING in major units — the one non-minor money field.
        revenueCurrency: { type: string }
        ownerUserId: { type: integer }
        customerId:
          type: [integer, "null"]
          description: The customer account this company belongs to.
        accountingManagerUserId: { type: [integer, "null"] }
        status: { type: string, enum: [ONBOARDING, ACTIVE, SUSPENDED, ARCHIVED] }
        onboardingCompleted: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CompanyDetail:
      allOf:
        - $ref: '#/components/schemas/Company'
        - type: object
          properties:
            primaryAddress:
              oneOf:
                - $ref: '#/components/schemas/Address'
                - type: "null"
            owner: { $ref: '#/components/schemas/Person' }
            accountingManager:
              oneOf:
                - $ref: '#/components/schemas/Person'
                - type: "null"
            accessRole:
              type: string
              enum: [ADMIN, OWNER, ACCOUNTING_MANAGER, SPECIALIST]
              description: The caller's relationship. Use it to decide which actions to render.

    Person:
      type: object
      properties:
        userId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: [string, "null"] }

    DirectoryUser:
      type: object
      properties:
        userId: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: [string, "null"] }
        specificRole: { type: [string, "null"] }
        jobTitle: { type: [string, "null"] }
        status: { type: string }

    Assignment:
      type: object
      properties:
        assignmentId: { type: integer }
        companyId: { type: integer }
        specialistUserId: { type: integer }
        specializationCode: { type: [string, "null"], enum: [BOOKKEEPING, PAYROLL, TAX, FA_Q, null] }
        specializationName: { type: [string, "null"] }
        assignmentStatus: { type: string, enum: [ACTIVE, INACTIVE] }
        assignedAt: { type: string, format: date-time }
        unassignedAt: { type: [string, "null"], format: date-time }
        specialist:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: "null"

    Team:
      type: object
      properties:
        companyId: { type: integer }
        owner: { $ref: '#/components/schemas/Person' }
        accountingManager:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: "null"
        specialists:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Person'
              - type: object
                properties:
                  specializations:
                    type: array
                    items:
                      type: object
                      properties:
                        assignmentId: { type: integer }
                        specializationCode: { type: string }
                        specializationName: { type: [string, "null"] }

    Invitation:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        roleId: { type: integer }
        roleCode: { type: [string, "null"] }
        roleName: { type: [string, "null"] }
        specificRoleId: { type: [integer, "null"] }
        specificRoleCode: { type: [string, "null"] }
        specificRoleName: { type: [string, "null"] }
        invitedById: { type: integer }
        invitedBy:
          oneOf:
            - $ref: '#/components/schemas/Person'
            - type: "null"
        acceptedUserId: { type: [integer, "null"] }
        status: { type: string, enum: [PENDING, SENT, ACCEPTED, EXPIRED, REVOKED] }
        isExpired:
          type: boolean
          description: Computed server-side, so the client does not depend on its own clock.
        expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PlanOption:
      type: object
      properties:
        optionId: { type: string, example: bookkeeping_option_2 }
        name: { type: string }
        unitAmountMinor: { type: integer, example: 24900, description: 24900 = $249.00 }
        currency: { type: string }
        billingInterval: { type: string, enum: [MONTH, YEAR] }
        displayOrder: { type: integer }
        quantityEnabled: { type: boolean }
        quantityLabel:
          type: string
          description: Present only when quantityEnabled. Use as the counter's label.
        component: { type: string, enum: [base, employees, contractors] }
        stripe: { $ref: '#/components/schemas/StripeIds' }

    StripeIds:
      type: object
      description: Present only when BILLING_EXPOSE_STRIPE_IDS is on (off in production). Never depend on it.
      properties:
        productId: { type: string }
        priceId: { type: string }
        subscriptionItemId: { type: string }
        invoiceId: { type: string }
        paymentIntentId: { type: string }
        subscriptionId: { type: string }
        checkoutSessionId: { type: string }

    PlanCatalog:
      type: object
      properties:
        currency: { type: string, example: USD }
        bookkeeping:
          type: array
          items: { $ref: '#/components/schemas/PlanOption' }
        taxes:
          type: array
          items: { $ref: '#/components/schemas/PlanOption' }
        payroll:
          type: array
          items:
            type: object
            properties:
              planId: { type: string, example: payroll_standard }
              components:
                type: object
                properties:
                  base: { $ref: '#/components/schemas/PlanOption' }
                  employees: { $ref: '#/components/schemas/PlanOption' }
                  contractors: { $ref: '#/components/schemas/PlanOption' }

    ServiceSelection:
      type: object
      required: [companyId]
      additionalProperties: false
      properties:
        companyId: { type: integer }
        selectedServices:
          type: object
          additionalProperties: false
          properties:
            bookkeeping:
              type: object
              additionalProperties: false
              properties:
                selected:
                  type: boolean
                  description: 'Opt-IN: only true or "true" selects. Anything else means not chosen.'
                priceOptionId: { type: string, enum: [bookkeeping_option_1, bookkeeping_option_2, bookkeeping_option_3, bookkeeping_option_4] }
            taxes:
              type: object
              additionalProperties: false
              properties:
                selected: { type: boolean }
                priceOptionId: { type: string, enum: [tax_option_1, tax_option_2, tax_option_3] }
            payroll:
              type: object
              additionalProperties: false
              properties:
                selected: { type: boolean }
                planId: { type: string, enum: [payroll_standard] }
                employeeCount: { type: integer, minimum: 0, maximum: 5000, default: 0 }
                contractorCount: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      example:
        companyId: 11
        selectedServices:
          bookkeeping: { selected: true, priceOptionId: bookkeeping_option_2 }
          payroll: { selected: true, planId: payroll_standard, employeeCount: 12, contractorCount: 3 }
          taxes: { selected: false }

    PricedLine:
      type: object
      properties:
        optionId: { type: string }
        quantity: { type: integer }
        unitAmountMinor: { type: integer }
        totalAmountMinor: { type: integer }
        stripe: { $ref: '#/components/schemas/StripeIds' }

    PricingSummary:
      type: object
      properties:
        currency: { type: string }
        bookkeeping: { $ref: '#/components/schemas/PricedLine' }
        taxes: { $ref: '#/components/schemas/PricedLine' }
        payroll:
          type: object
          properties:
            base: { $ref: '#/components/schemas/PricedLine' }
            employees: { $ref: '#/components/schemas/PricedLine' }
            contractors: { $ref: '#/components/schemas/PricedLine' }
            totalAmountMinor: { type: integer }
        grandTotalAmountMinor: { type: integer }

    ServiceStatus:
      type: object
      properties:
        service: { type: string, enum: [bookkeeping, payroll, taxes] }
        status: { type: string, enum: [active, inactive] }
        priceOptionId: { type: string, description: Bookkeeping and tax only. }
        planId: { type: string, description: Payroll only. }
        employeeCount: { type: integer, description: Payroll only. }
        contractorCount: { type: integer, description: Payroll only. }

    CheckoutStatus:
      type: object
      properties:
        status:
          type: string
          enum: [paid, processing, pending, cancelled, failed]
          description: |
            The field to switch on. Keep polling while pending or processing.
        checkoutStatus: { type: string, enum: [open, complete, expired], description: Stripe's raw session status. }
        paymentStatus: { type: [string, "null"], description: Stripe's raw payment status. }
        companyId: { type: integer }
        subscriptionStatus:
          type: [string, "null"]
          enum: [INCOMPLETE, ACTIVE, PAST_DUE, CANCELED, UNPAID, null]
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatus' }

    SubscriptionLine:
      type: object
      properties:
        service: { type: [string, "null"] }
        component: { type: string, enum: [plan, base, employees, contractors] }
        optionId: { type: [string, "null"] }
        planName: { type: [string, "null"] }
        quantity: { type: integer }
        unitAmountMinor: { type: integer, description: The price captured AT PURCHASE. }
        totalAmountMinor: { type: integer }
        currency: { type: string }
        stripe: { $ref: '#/components/schemas/StripeIds' }

    Subscription:
      type: object
      properties:
        subscriptionId: { type: integer }
        companyId: { type: integer }
        status: { type: string, enum: [INCOMPLETE, ACTIVE, PAST_DUE, CANCELED, UNPAID] }
        currentPeriodStart: { type: [string, "null"], format: date-time }
        currentPeriodEnd: { type: [string, "null"], format: date-time }
        cancelAtPeriodEnd: { type: boolean }
        canceledAt: { type: [string, "null"], format: date-time }
        currency: { type: string }
        recurringTotalAmountMinor: { type: integer }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceStatus' }
        lines:
          type: array
          items: { $ref: '#/components/schemas/SubscriptionLine' }
          description: Excludes components whose quantity dropped to 0.
        stripe: { $ref: '#/components/schemas/StripeIds' }

    Payment:
      type: object
      properties:
        paymentId: { type: integer }
        amountPaidMinor: { type: integer }
        amountRefundedMinor: { type: integer, description: 0 when nothing was refunded. }
        currency: { type: string }
        status: { type: string, enum: [PENDING, PAID, FAILED, REFUNDED] }
        paidAt: { type: [string, "null"], format: date-time }
        refundedAt: { type: [string, "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        failureReason: { type: [string, "null"], example: card_declined }
        stripe: { $ref: '#/components/schemas/StripeIds' }
